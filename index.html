<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Heart Animation</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            height: 100vh;
        }

        #heart {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .love {
            position: absolute;
            color: pink;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;

            text-shadow:
                0 0 5px pink,
                0 0 10px hotpink;

            white-space: nowrap;

            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from {
                opacity: 0.4;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<div id="heart"></div>

<script>

const heart = document.getElementById("heart");

const totalItems = 220;

for (let i = 0; i < totalItems; i++) {

    const t = (Math.PI * 2 * i) / totalItems;

    // Formule du coeur
    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    const love = document.createElement("div");

    love.className = "love";

    love.innerHTML = "I love you";

    // Centre de l'écran
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    // Taille du coeur
    const scale = 18;

    love.style.left =
        centerX + x * scale + "px";

    love.style.top =
        centerY - y * scale + "px";

    // Rotation autour du coeur
    love.style.transform =
        `rotate(${t * 180 / Math.PI}deg)`;

    // Petit délai différent pour chaque mot
    love.style.animationDelay =
        (i * 0.01) + "s";

    heart.appendChild(love);
}

</script>

</body>
</html>
